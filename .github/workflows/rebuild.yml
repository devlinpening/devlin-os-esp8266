name: Rebuild DEVLIN OS ESP8266 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/rebuild.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find and extract ESP8266 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/DEVLIN_SOURCE_ESP8266.zip"
          if [ ! -s "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*ESP8266*.zip' -print -quit)"
          fi
          if [ -z "${ZIP_FILE:-}" ] || [ ! -s "$ZIP_FILE" ]; then
            echo 'ERROR: No ESP8266 source ZIP found in the repository root.' >&2
            echo 'Upload DEVLIN_SOURCE_ESP8266.zip to the repository root, then run this workflow again.' >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/_devlin_source"
          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_devlin_source"
          INI_FILE="$(find "$GITHUB_WORKSPACE/_devlin_source" -type f -name platformio.ini -print -quit)"
          if [ -z "$INI_FILE" ]; then
            echo 'ERROR: platformio.ini was not found inside the ZIP.' >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$INI_FILE")"
          test -s "$PROJECT_DIR/src/main.cpp"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project at: $PROJECT_DIR"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Compile Wemos D1 mini ESP8266, 4 MB, SSD1306
        run: pio run -d "$PROJECT_DIR" -e devlin_esp8266

      - name: Verify and package firmware
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PROJECT_DIR/.pio/build/devlin_esp8266/firmware.bin"
          test -s "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$BIN" "$GITHUB_WORKSPACE/release/DEVLIN_OS_ESP12F_SSD1306_4MB.bin"
          cat > "$GITHUB_WORKSPACE/release/FLASH_INSTRUCTIONS.txt" <<'TXT'
          DEVLIN OS - Wemos D1 mini / ESP8266 ESP-12F / 4 MB / SSD1306

          Firmware: DEVLIN_OS_ESP12F_SSD1306_4MB.bin
          Chip: ESP8266 (NOT ESP32)
          Flash address: 0x00000
          Flash size: 4 MB
          Flash mode: DOUT

          Flash only this one .bin file at address 0x00000 using an ESP8266-compatible Android flasher.
          Do not use ESP32 bootloader.bin, partitions.bin, or boot_app0.bin files.

          Expected wiring from the supplied schematic:
          OLED SDA -> D2 / GPIO4
          OLED SCL -> D1 / GPIO5
          Confirm -> D7 / GPIO13
          Down -> D6 / GPIO12
          Up -> D5 / GPIO14
          Back -> D3 / GPIO0
          Start -> D4 / GPIO2

          Release Back and Start while powering on, resetting, or flashing because GPIO0/GPIO2 are boot-strap pins.
          Use OLED VCC at 3V3 unless the exact module is confirmed to have safe I2C level shifting.
          TXT
          sha256sum "$GITHUB_WORKSPACE/release/DEVLIN_OS_ESP12F_SSD1306_4MB.bin" > "$GITHUB_WORKSPACE/release/SHA256SUMS.txt"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEVLIN_OS_ESP8266_FIRMWARE
          path: release/*
          if-no-files-found: error
          retention-days: 14
